# garage.toml — generated by garage-ware
#
# Place this file at /etc/garage.toml on EVERY node, then fill in the
# @PLACEHOLDER@ values. garage-ware does not install or run Garage; this is
# a starting point you take to your own hosts.
#
# Reference: https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/

# Three copies of every block. The recommended setting: the cluster survives
# losing one node outright, and stays readable while a second is offline.
# Needs at least three storage nodes.
# https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/#replication_factor
replication_factor = 3

# Where the metadata database lives. Fast storage (an SSD) is strongly
# preferred — this is the latency-sensitive half of a Garage node.
# https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/#metadata_dir
metadata_dir = "/var/lib/garage/meta"

# Where object data blocks live. This is the bulk storage.
# https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/#data_dir
data_dir = "/var/lib/garage/data"

# Metadata engine. LMDB is the default and the recommended choice.
# https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/#db_engine
db_engine = "lmdb"

# Shared secret authenticating RPC between nodes. It must be IDENTICAL on
# every node. Generate it once, yourself:
#   openssl rand -hex 32
# https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/#rpc_secret
rpc_secret = "@RPC_SECRET@"

# The address the RPC service listens on.
# https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/#rpc_bind_addr
rpc_bind_addr = "[::]:3901"

# This node's address as OTHER nodes reach it — different on every node,
# and the one line in this file you cannot copy verbatim.
# https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/#rpc_public_addr
rpc_public_addr = "@THIS_NODE_PUBLIC_IP@:3901"

# Peers contacted at startup, as <node-id>@<host>:<rpc-port>. Read a
# node's id with `garage node id` on that node. Leave empty on the first
# node and add the others once they exist.
# https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/#bootstrap_peers
bootstrap_peers = []

[s3_api]
# The region S3 clients must use. Must match this deployment's
# GARAGE_S3_REGION.
# https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/#s3_region
s3_region = "garage"

# The S3 endpoint — what this deployment's GARAGE_S3_ENDPOINT points at.
# https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/#s3_api_bind_addr
api_bind_addr = "[::]:3900"

[admin]
# The admin API. garage-ware talks to THIS port: it has to be reachable
# from wherever garage-ware runs, and it is what GARAGE_ADMIN_URL points
# at.
# https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/#admin_api_bind_addr
api_bind_addr = "[::]:3903"

# garage-ware authenticates with a token you mint once the cluster is up:
#   garage admin-token create --name garage-ware
# Put the result in garage-ware's GARAGE_ADMIN_TOKEN. Garage v2 discourages
# the static master token below in favour of that command, so it is left
# commented out — uncomment it only if you specifically want one.
# https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/#admin_token
# admin_token = "@ADMIN_TOKEN@"

# ──────────────────────────────────────────────────────────────────────────
# Zone and capacity are NOT settings in this file.
#
# They belong to the cluster layout, assigned with the CLI once every node
# is running and has joined. From any node:
#
#   garage status
#   garage layout assign <node-key> -z <zone> -c <capacity> -t <name>
#   garage layout show
#   garage layout apply --version <n>
#
# For this 3-node plan:
#
#   garage layout assign <node1-key> -z home -c 1T -t node1
#   garage layout assign <node2-key> -z home -c 1T -t node2
#   garage layout assign <node3-key> -z home -c 1T -t node3
#   garage layout apply --version 1
#
# https://garagehq.deuxfleurs.fr/documentation/operations/layout/
# ──────────────────────────────────────────────────────────────────────────
