nodeLinker: node-modules

compressionLevel: mixed

enableGlobalCache: false




# @next/eslint-plugin-next@16.3.0 added @eslint-community/eslint-utils as a
# dependency, which peer-depends on eslint — but the plugin itself declares no
# eslint peer, so Yarn has nothing to forward and reports an unmet requirement.
# Upstream packaging bug; declaring the peer here lets it resolve from the
# workspace's own eslint. Drop this once the plugin ships the peer itself.
packageExtensions:
  '@next/eslint-plugin-next@*':
    peerDependencies:
      eslint: '*'
