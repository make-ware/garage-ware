[supervisord]
nodaemon=true
# Send supervisord's own bookkeeping (spawned/exited events) to container stdout
# so `docker logs <container>` shows process lifecycle alongside app output.
logfile=/dev/fd/1
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
user=root

[program:pocketbase]
command=/bin/sh -c "/app/pb/pocketbase serve --http=0.0.0.0:8090 --dir=/data/pb_data --hooksDir=/app/pb/pb_hooks --migrationsDir=/app/pb/pb_migrations 2>&1 | awk '{ print \"[pocket] \" $0; fflush() }'"
directory=/app/pb
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/null
stderr_logfile_maxbytes=0
user=nextjs
environment=HOME="/app",USER="nextjs"

[program:nextjs]
# Invoke Next.js directly via node — going through `yarn` triggers corepack,
# which tries to write its cache under $HOME and crashes with EACCES.
command=/bin/sh -c "node /app/node_modules/next/dist/bin/next start --hostname 0.0.0.0 --port 3000 2>&1 | awk '{ print \"[nextjs] \" $0; fflush() }'"
directory=/app/webapp
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/null
stderr_logfile_maxbytes=0
user=nextjs
environment=USER="nextjs",NODE_ENV="production",POCKETBASE_URL="http://localhost:8090"
# Wait a bit for PocketBase to start
startsecs=5
startretries=3

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
user=root
priority=10

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
